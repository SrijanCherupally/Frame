name: Native Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'assets/**', 'examples/**', 'tests/**', 'scripts/**', 'downloads/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'assets/**', 'examples/**', 'tests/**', 'scripts/**', 'downloads/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Test, build and package the complete offline application
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Exercise bundled Windows media tools and Frame discovery
        shell: pwsh
        run: |
          ./scripts/test-windows-media.ps1 -PackageDir windows-package
          $env:PATH = "$pwd/windows-package;$env:PATH"
          cargo test --locked --test motion_render -- --test-threads=2
          if ($LASTEXITCODE -ne 0) { throw "Windows animation rendering tests failed." }
      - name: Upload offline Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Windows-x64
          path: windows-package.zip
          if-no-files-found: error
