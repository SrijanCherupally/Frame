[package]
name = "frame-studio"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust desktop video editor with FFmpeg processing"

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fontdue = "0.9"
tiny-skia = "0.11"
crossbeam-channel = "0.5"
directories = "6"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.dev]
debug = 1
